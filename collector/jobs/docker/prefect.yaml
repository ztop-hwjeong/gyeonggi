name: docker-collector
prefect-version: 3.9.0
build: []
push: []
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app/jobs/docker
deployments:
  - name: docker-check
    entrypoint: src/flows/runtime.py:docker_runtime_check
    tags: [docker]
    schedules: null
    work_pool:
      name: docker-collector
      job_variables:
        image: gyeonggi-collector:local
        image_pull_policy: Never
        networks: [gyeonggi-collector]
        auto_remove: true
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
  - name: bigkinds-list
    entrypoint: src/flows/bigkinds.py:bigkinds_collect_list
    tags: [docker, bigkinds, list]
    schedules: null
    concurrency_limit: 1
    work_pool:
      name: docker-collector
      job_variables:
        image: gyeonggi-collector:local
        image_pull_policy: Never
        networks: [gyeonggi-collector]
        auto_remove: true
        volumes: ["gyeonggi-collector-data:/var/lib/collector"]
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
          BIGKINDS_RATE_LIMIT_NAME: bigkinds-http
          COLLECTION_OUTPUT_DIRECTORY: /var/lib/collector
          HTTP_IMPERSONATE: chrome
  - name: naver-news
    entrypoint: src/flows/naver.py:naver_collect_list
    tags: [docker, naver, list, news]
    schedules: []
    concurrency_limit: 1
    parameters:
      request:
        channel: news
        terms: &policy-terms [폰프리스쿨, 폰프리 스쿨, 교권보호, 경기RAS, 벽깨기교육, 편한교복]
        page_size: 50
        max_pages: 20
    work_pool: &naver-pool
      name: docker-collector
      job_variables:
        image: gyeonggi-collector:local
        image_pull_policy: Never
        networks: [gyeonggi-collector]
        auto_remove: true
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
          NAVER_CREDENTIALS_BLOCK: naver-api-hub-credentials
          NAVER_RATE_LIMIT_NAME: naver-api-hub-http
          NAVER_DAILY_REQUEST_LIMIT: "1000"
          NAVER_OVERLAP_PAGES: "1"
          NAVER_DATE_OVERLAP_DAYS: "1"
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
          DATABASE_NAME: gyeonggi
          DATABASE_USER: gyeonggi
          DATABASE_PASSWORD_BLOCK: collector-postgres-password
          OBJECT_STORAGE_ENDPOINT_URL: http://rustfs:9000
          OBJECT_STORAGE_BUCKET: collector-raw
          OBJECT_STORAGE_REGION: us-east-1
          OBJECT_STORAGE_CREDENTIALS_BLOCK: collector-object-storage-credentials
          HTTP_IMPERSONATE: chrome
          BIGKINDS_RATE_LIMIT_NAME: bigkinds-http
  - name: naver-blog
    entrypoint: src/flows/naver.py:naver_collect_list
    tags: [docker, naver, list, blog]
    schedules: []
    concurrency_limit: 1
    parameters:
      request:
        channel: blog
        terms: *policy-terms
        page_size: 50
        max_pages: 20
    work_pool: *naver-pool
  - name: managed-collection
    entrypoint: src/flows/managed.py:managed_collection
    tags: [docker, collection, managed]
    schedules: null
    concurrency_limit: 1
    work_pool: *naver-pool
  - name: collection-dispatch
    entrypoint: src/flows/dispatch.py:dispatch_collections
    tags: [docker, collection, dispatch]
    schedules:
      - interval: 60
        active: true
    concurrency_limit: 1
    work_pool: *naver-pool
  - name: managed-backfill
    entrypoint: src/flows/managed.py:managed_collection
    tags: [docker, collection, backfill]
    schedules: null
    concurrency_limit: 1
    work_pool: *naver-pool
  - name: stored-article-analysis
    entrypoint: src/flows/analysis.py:analyze_stored_article
    tags: [docker, analysis]
    schedules: null
    work_pool:
      name: docker-collector
      job_variables:
        image: gyeonggi-collector:local
        image_pull_policy: Never
        networks: [gyeonggi-collector]
        auto_remove: true
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
          DATABASE_NAME: gyeonggi
          DATABASE_USER: gyeonggi
          DATABASE_PASSWORD_BLOCK: collector-postgres-password
          OPENAI_API_KEY_BLOCK: openai-api-key
          BACKEND_API_URL: http://backend:8000
  - name: article-analysis-dispatch
    entrypoint: src/flows/analysis_dispatch.py:dispatch_article_analysis
    tags: [docker, analysis, dispatch]
    schedules:
      - interval: 60
        active: true
    work_pool:
      name: docker-collector
      job_variables:
        image: gyeonggi-collector:local
        image_pull_policy: Never
        networks: [gyeonggi-collector]
        auto_remove: true
        env:
          PREFECT_API_URL: http://prefect-server:4200/api
          DATABASE_HOST: postgres
          DATABASE_PORT: "5432"
          DATABASE_NAME: gyeonggi
          DATABASE_USER: gyeonggi
          DATABASE_PASSWORD_BLOCK: collector-postgres-password
