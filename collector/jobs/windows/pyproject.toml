[project]
name = "gyeonggi-windows-collector-jobs"
version = "0.1.0"
description = "Windows 기사 원문 수집 작업"
requires-python = ">=3.13,<3.14"
dependencies = [
    "collector-http",
    "dishka>=1.10.1",
    "prefect>=3.9.0",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.1",
    "trafilatura>=2.3.1",
    "scrapling>=0.5",
    "sqlalchemy>=2.1.6",
    "rapidfuzz>=3.14.6",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "collector-storage",
    "w3lib>=2.5.0",
]

[tool.uv]
package = false

[tool.uv.sources]
collector-http = { path = "../../packages/http", editable = true }
collector-storage = { path = "../../packages/storage", editable = true }

[dependency-groups]
dev = ["pyright>=1.1.414", "pytest>=9.1.1", "ruff>=0.17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.pyright]
include = ["src", "tests", "../../packages/http/src", "../../packages/storage/src"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportDeprecated = "error"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
