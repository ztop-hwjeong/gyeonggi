resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $cloudbeaver_connection {
    default upgrade;
    '' close;
}

upstream backend_app {
    zone backend_app 64k;
    server backend:8000 resolve;
}

upstream frontend_app {
    zone frontend_app 64k;
    server frontend:3000 resolve;
}

upstream cloudbeaver_app {
    zone cloudbeaver_app 64k;
    server cloudbeaver:8978 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://backend_app/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location = /cloudbeaver {
        return 308 /cloudbeaver/;
    }

    location /cloudbeaver/ {
        proxy_pass http://cloudbeaver_app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix /cloudbeaver;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cloudbeaver_connection;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
