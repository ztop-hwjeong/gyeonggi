services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: gyeonggi
      POSTGRES_USER: gyeonggi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gyeonggi}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.docker/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
