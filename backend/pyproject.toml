[project]
name = "gyeonggi-backend"
version = "0.1.0"
description = "경기교육 정책 홍보 분석 API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "dishka>=1.10.1",
    "fastapi>=0.159.1",
    "jsonschema>=4.26.0",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "templexl==0.1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportDeprecated = "error"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
